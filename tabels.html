<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>برنامه هفتگی دانشجو</title>

    <style>
        body {
            font-family: Tahoma, Arial, sans-serif;
            background-color: #f2f2f2;
            text-align: center;
        }

        h1 {
            color: #333;
        }

        table {
            width: 80%;
            margin: 20px auto;
            border-collapse: collapse;
            background-color: white;
        }

        th, td {
            border: 1px solid #999;
            padding: 12px;
        }

        th {
            background-color: #007bff;
            color: white;
        }

        tr:hover {
            background-color: #e6f2ff;
        }

        a {
            color: #007bff;
            text-decoration: none;
        }

        a:hover {
            color: #e63946;
            text-decoration: underline;
        }

        .back-link {
            display: inline-block;
            margin: 20px;
        }
    </style>
</head>

<body id="top">

    <h1>برنامه هفتگی دانشجو</h1>

    <table>
        <tr>
            <th>روز</th>
            <th>درس</th>
            <th>ساعت</th>
            <th>لینک آموزش</th>
        </tr>

        <tr>
            <td>شنبه</td>
            <td>HTML</td>
            <td>۸ تا ۱۰</td>
            <td>
                <a href="https://www.w3schools.com/html/">
                    آموزش HTML
                </a>
            </td>
        </tr>

        <tr>
            <td>یکشنبه</td>
            <td>CSS</td>
            <td>۱۰ تا ۱۲</td>
            <td>
                <a href="https://www.w3schools.com/css/">
                    آموزش CSS
                </a>
            </td>
        </tr>

        <tr>
            <td>دوشنبه</td>
            <td>JavaScript</td>
            <td>۸ تا ۱۰</td>
            <td>
                <a href="https://www.w3schools.com/js/">
                    آموزش JavaScript
                </a>
            </td>
        </tr>

        <tr>
            <td>سه‌شنبه</td>
            <td>Python</td>
            <td>۱۲ تا ۱۴</td>
            <td>
                <a href="https://www.w3schools.com/python/">
                    آموزش Python
                </a>
            </td>
        </tr>

        <tr>
            <td>چهارشنبه</td>
            <td>Linux</td>
            <td>۱۰ تا ۱۲</td>
            <td>
                <a href="https://linuxjourney.com/">
                    آموزش Linux
                </a>
            </td>
        </tr>
    </table>

    <a href="#top" class="back-link">
        بازگشت به بالای صفحه
    </a>

</body>
</html>
